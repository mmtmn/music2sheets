[project]
name = "music2sheets"
version = "0.1.0"
description = "music2sheets model worker: separation, transcription and model front ends for the Rust m2s pipeline."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "soxr>=0.3",
    "librosa>=0.10",
    "pretty_midi>=0.2.10",
    "mido>=1.3",
    "music21>=9.1",
    "mir_eval>=0.7",
    "pyyaml>=6",
    "verovio>=4.3",
    "cairosvg>=2.7",
    "pypdf>=4",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Neural models. Needs a recent NVIDIA GPU for reasonable speed; CPU works but is slow.
models = [
    "torch>=2.3",
    "torchaudio>=2.3",
    "transkun>=2.0.1",
    "piano_transcription_inference>=0.0.6",
    "audioread>=3.0",
    "beat-this>=1.1",
    "torchcrepe>=0.0.23",
    "demucs>=4.0.1",
    "basic-pitch>=0.4",
    "onnxruntime>=1.17",
    "panns-inference>=0.1.1",
    "resampy>=0.4",
]
# scoring against reference scores (m2s eval)
eval = ["synctoolbox>=1.4", "pandas>=2", "musicdiff>=6", "pyguitarpro>=0.10"]
# drum transcription; ADTOF's weights are CC BY-NC-SA 4.0 (non-commercial)
drums = ["adtof-pytorch @ git+https://github.com/xavriley/ADTOF-pytorch"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["m2s"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv]
# Tested on Linux with CUDA; the lock covers Linux only (see README for other platforms).
environments = ["sys_platform == 'linux'"]
# basic-pitch pins an old TensorFlow that has no Python 3.12 wheels. We only use
# its ONNX model (run through onnxruntime), so TensorFlow and tflite are dropped.
override-dependencies = [
    "tensorflow; sys_platform == 'never'",
    "tensorflow-macos; sys_platform == 'never'",
    "tflite-runtime; sys_platform == 'never'",
    "coremltools; sys_platform == 'never'",
    # synctoolbox pins music21<10 but only uses it in MusicXML/CSV helpers we never call;
    # musicdiff needs music21>=10.5, and the alignment code runs fine on it
    "music21>=10.5",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
