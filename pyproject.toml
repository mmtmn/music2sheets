[project]
name = "music2sheets"
version = "0.1.0"
description = "Audio to playable sheet music: source separation, transcription, a deterministic playability solver, and audio-verified notation."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "soundfile>=0.12",
    "soxr>=0.3",
    "librosa>=0.10",
    "pretty_midi>=0.2.10",
    "mido>=1.3",
    "music21>=9.1",
    "mir_eval>=0.7",
    "pyyaml>=6",
    "verovio>=4.3",
    "cairosvg>=2.7",
    "pypdf>=4",
    "typer>=0.12",
    "rich>=13",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
# Neural models. Needs a recent NVIDIA GPU for reasonable speed; CPU works but is slow.
models = [
    "torch>=2.3",
    "torchaudio>=2.3",
    "transkun>=2.0.1",
    "piano_transcription_inference>=0.0.6",
    "audioread>=3.0",
    "beat-this>=1.1",
    "torchcrepe>=0.0.23",
    "demucs>=4.0.1",
    "basic-pitch>=0.4",
    "onnxruntime>=1.17",
]
dev = ["pytest>=8"]

[project.scripts]
m2s = "m2s.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["m2s"]

[tool.uv]
# basic-pitch pins an old TensorFlow that has no Python 3.12 wheels. We only use
# its ONNX model (run through onnxruntime), so TensorFlow and tflite are dropped.
override-dependencies = [
    "tensorflow; sys_platform == 'never'",
    "tensorflow-macos; sys_platform == 'never'",
    "tflite-runtime; sys_platform == 'never'",
    "coremltools; sys_platform == 'never'",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]
torchaudio = [{ index = "pytorch-cu128", marker = "sys_platform == 'linux'" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
